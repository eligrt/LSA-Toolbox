<title>LSA Toolbox - Flight Utilities</title>
<meta name="description" content="ELIGRT's aviation tools - checklists, weight & balance, logbook, and flight planning.">
<meta property="og:title" content="LSA Toolbox - Flight Utilities">
<meta property="og:description" content="ELIGRT's aviation tools - checklists, weight & balance, logbook, and flight planning.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://eligrt.github.io/LSA-Toolbox/">
<meta property="og:image" content="https://eligrt.github.io/LSA-Toolbox/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4ecdc;--paper-hi:#fbf6e8;--paper-edge:#e3d4ad;--paper-line:rgba(28,61,110,.07);
  --ink:#1c3d6e;--ink-muted:#5a4a3a;--ink-faint:#8a7a5a;
  --gold:#c8a04a;--gold-lite:#d4b878;--gold-deep:#8a6a2a;--gold-tint:#f1e2bc;
  --beta:#a32d2d;
  --font-ui:'IBM Plex Sans Hebrew',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;height:var(--app-h,100%);-webkit-text-size-adjust:100%;overflow:hidden;background:var(--paper)}
body{
  height:100svh;height:var(--app-h,100svh);overflow:hidden;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);font-family:var(--font-ui);line-height:1.4;
}
/* phone frame only on wide screens (desktop / tablet); phones use the full width, even 440pt ones */
@media(min-width:600px){
  html{background:#1a1a1c}
  body{max-width:430px;margin:0 auto;border-left:2px solid var(--gold);border-right:2px solid var(--gold);box-shadow:0 0 60px rgba(0,0,0,.6)}
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

/* HEADER */
.header{
  flex-shrink:0;background:var(--ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;direction:ltr;
  min-height:calc(58px + env(safe-area-inset-top));
}
.hdr-clock{display:flex;align-items:baseline;gap:6px;color:var(--paper);font-family:var(--font-mono);direction:ltr}
.hdr-clock-lbl{font-size:10px;opacity:.75;letter-spacing:.18em}
#utcClock{font-size:21px;font-weight:700;line-height:1}
.hdr-rail{display:flex;align-items:center;gap:10px;min-width:0}
.hdr-glyph{width:38px;height:38px;flex:0 0 38px;border-radius:9px;overflow:hidden;border:1px solid var(--gold);background:var(--paper)}
.hdr-glyph img{width:100%;height:100%;display:block;object-fit:cover}
.hdr-title{direction:ltr;text-align:left}
.hdr-title h1{font-size:16.5px;line-height:1.25;font-weight:700;letter-spacing:-.1px;color:var(--paper)}
.hdr-title p{color:var(--gold-lite);font-weight:500;margin-top:1px;line-height:1.3;font-size:10.5px}

/* CONTENT: ruled paper */
.viewport{position:relative;flex:1;display:flex;min-height:0}
.content{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px 18px;
  background:var(--paper);
}
.content::-webkit-scrollbar{width:0}
.sec-label{direction:ltr;
  font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.12em;
  color:var(--gold-deep);display:flex;align-items:center;gap:10px;margin:0 0 12px;
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--gold-lite)}
.sec-label.next{margin-top:22px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid.ext{grid-template-columns:repeat(2,1fr)}

/* TOOL CARDS */
.card{
  position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  background:var(--paper-hi);border:1px solid var(--gold-lite);border-radius:12px;
  padding:12px 6px 10px;text-decoration:none;color:inherit;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.card:active{transform:scale(.97)}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(28,61,110,.14);border-color:var(--gold)}}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.card.soon{opacity:.62;cursor:default}
.icon{
  position:relative;width:56px;height:56px;border-radius:14px;flex:none;
  border:1.5px solid var(--gold);background:var(--paper);overflow:visible;
}
.icon img{width:100%;height:100%;display:block;border-radius:12px;object-fit:cover}
.icon img.contain{object-fit:contain;padding:5px}
.icon.bare{border-color:transparent;background:none}
.icon.bare img{border-radius:0}
.tag{
  position:absolute;top:-6px;right:-8px;z-index:2;
  background:var(--beta);color:#fff;border-radius:4px;padding:2px 4px;
  font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:.08em;line-height:1;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.tag.soon{background:var(--ink-faint)}
.name{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--ink);direction:ltr;line-height:1.2}
.desc{font-size:11px;color:var(--ink-muted);line-height:1.3;direction:rtl}
.more-toggle{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:auto;padding:3px 2px 0;background:none;border:none;color:var(--gold-deep);font-family:var(--font-ui)}
.more-toggle span{font-size:10.5px;direction:rtl}
.more-toggle svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.card.open .more-toggle svg{transform:rotate(180deg)}
.card-more{max-height:0;overflow:hidden;transition:max-height .25s ease;width:100%}
.card-more p{font-size:10.5px;color:var(--ink-muted);line-height:1.4;direction:rtl;text-align:right;padding-top:4px;border-top:1px dashed var(--gold-lite);margin-top:4px}

/* EXTERNAL LINKS */
.card.link{flex-direction:row;gap:10px;text-align:right;padding:10px 12px;align-items:center}
.card.link .icon{width:38px;height:38px;border-radius:10px;border-width:1px;display:grid;place-items:center;background:var(--gold-tint)}
.card.link .icon svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.link .txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.card.link .name{font-family:var(--font-ui);font-size:12.5px;font-weight:600;direction:rtl;text-align:right}
.card.link .sub{font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.link .go{width:14px;height:14px;stroke:var(--gold-deep);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* scroll cue */
.scroll-fade{position:absolute;left:0;right:0;bottom:0;height:56px;pointer-events:none;z-index:15;background:linear-gradient(to bottom,rgba(244,236,220,0),var(--paper));transition:opacity .35s ease}
.scroll-btn{position:absolute;left:50%;bottom:10px;width:38px;height:38px;border-radius:50%;background:var(--paper-hi);border:1px solid var(--paper-edge);display:grid;place-items:center;z-index:16;box-shadow:0 4px 14px rgba(43,38,32,.12);transform:translateX(-50%);animation:bob 1.8s ease-in-out infinite;padding:0;transition:opacity .35s ease}
.scroll-btn svg{width:18px;height:18px;stroke:var(--gold-deep);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.scroll-fade.hide,.scroll-btn.hide{opacity:0;pointer-events:none}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}

/* FOOTER */
.stats-note{margin-top:16px;text-align:center;font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase}
.page-footer{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;direction:rtl;
  padding:7px 12px max(8px, calc(env(safe-area-inset-bottom) - 16px));
  font-family:var(--font-mono);font-size:9px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;
  border-top:1px solid var(--gold-lite);background:var(--paper-hi);
}
.page-footer a{color:var(--gold-deep);text-decoration:none}
.footer-refresh{line-height:13px;flex:0 0 52px;text-align:right;background:none;border:0;padding:6px 0;font-family:var(--font-ui);font-size:11px;color:var(--ink-muted);text-decoration:underline;text-underline-offset:2px;opacity:.75;cursor:pointer;text-transform:none;letter-spacing:.02em}
.footer-refresh:active{opacity:.4}
.page-footer .ver{direction:ltr;flex:1;text-align:center}
.page-footer .spacer{flex:0 0 52px}

/* SPLASH */
#splash{
  position:fixed;top:0;left:0;right:0;margin:0 auto;width:100%;height:100svh;height:var(--app-h,100svh);z-index:500;
  background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  transition:opacity .32s ease-in-out;cursor:pointer;
}
@media(min-width:600px){#splash{max-width:430px;border-left:2px solid var(--gold);border-right:2px solid var(--gold);box-shadow:0 0 60px rgba(0,0,0,.6)}}
#splash.fade{opacity:0;pointer-events:none}
#splash.gone{display:none}
.sp-logo{width:180px;height:auto;display:block}
.sp-title{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.08em;margin-top:18px;direction:ltr}
.sp-tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-deep);margin-top:6px;margin-bottom:26px;padding-left:.3em;direction:ltr}
.sp-line1{font-size:16px;white-space:nowrap;font-weight:600;color:var(--ink);min-height:26px;text-align:center;direction:ltr}
.sp-line2{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-muted);margin-top:8px;min-height:20px;opacity:0;transition:opacity .4s ease;direction:ltr}
.sp-line2.show{opacity:1}
.sp-foot{position:absolute;left:0;right:0;bottom:0}
.sp-skip{position:absolute;bottom:calc(52px + max(0px, calc(env(safe-area-inset-bottom) - 16px)));font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;color:var(--ink-faint);text-transform:uppercase}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:360px){.name{font-size:10.5px}.desc{font-size:10px}.icon{width:50px;height:50px}}
</style>

      <span>מידע נוסף</span><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="card-more"><p>${t.more}</p></div>` : '';
  const inner = `
    <span class="icon${t.bare?' bare':''}">${tag}<img class="${t.fit==='contain'?'contain':''}" src="${t.icon}" alt=""></span>
    <span class="name">${t.name}</span>
    <span class="desc">${t.desc}</span>${more}`;
  if(!t.url) return `<div class="card soon" aria-disabled="true">${inner}</div>`;
  if(t.track) return `<a class="card" href="${t.url}?from=tb" target="_blank" rel="noopener" onclick="tbTap('${t.id}')">${inner}</a>`;   // ?from=tb lets the tool count opens that came from the Toolbox
  return `<a class="card" href="${t.url}" target="_blank" rel="noopener" onclick="tbTap('${t.id}')">${inner}</a>`;
}
function toggleMore(e, btn, id){
  e.preventDefault(); e.stopPropagation();
  const card = btn.closest('.card'), box = card.querySelector('.card-more');
  const open = card.classList.toggle('open');
  box.style.maxHeight = open ? box.scrollHeight + 'px' : '0px';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  if(open) tbMore(id);
  setTimeout(updateCue, 280);
}
function linkHTML(t){
  return `<a class="card link" href="${t.url}" target="_blank" rel="noopener" onclick="tbTap('${t.id}')">
    <span class="icon">${t.svg}</span>
    <span class="txt"><span class="name">${t.name}</span><span class="sub">${t.sub}</span></span>
    ${GO}
  </a>`;
}
document.getElementById('grid-main').innerHTML = MAIN.map(toolHTML).join('');
document.getElementById('grid-more').innerHTML = MORE.map(toolHTML).join('');
document.getElementById('grid-ext').innerHTML = EXT.map(linkHTML).join('');

/* ---- anonymous usage stats (Firebase REST, fire and forget) ---- */
const TB_DB = 'https://aircheck-80530-default-rtdb.europe-west1.firebasedatabase.app';
const TB_SV = {'.sv':'timestamp'}, TB_INC = {'.sv':{increment:1}};
function tbRand(){
  let s='';
  try{ const a=new Uint8Array(12); crypto.getRandomValues(a); a.forEach(b=>s+=(b%36).toString(36)); }
  catch(e){ while(s.length<12) s+=Math.floor(Math.random()*36).toString(36); }
  return s;
}
function tbId(){
  try{
    let id=localStorage.getItem('lsatb_id');
    if(!id||!/^[a-z0-9]{8,32}$/.test(id)){ id=tbRand(); localStorage.setItem('lsatb_id',id); }
    return id;
  }catch(e){ return window.__tbTmp||(window.__tbTmp=tbRand()); }
}
function tbVer(){
  const m=(document.querySelector('.page-footer .ver')||{textContent:''}).textContent.match(/v[0-9][0-9.]*/);
  return m?m[0]:'v0';
}
function tbOS(){
  const u=navigator.userAgent||'';
  if(/android/i.test(u)) return 'Android';
  if(/iphone|ipad|ipod/i.test(u)) return 'iOS';
  if(/windows/i.test(u)) return 'Windows';
  if(/mac/i.test(u)) return 'Mac';
  if(/linux/i.test(u)) return 'Linux';
  return 'other';
}
function tbDay(){ const d=new Date(),p=v=>String(v).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
const TB_QK = 'lsatb_q';
function tbQ(){ try{ return JSON.parse(localStorage.getItem(TB_QK)||'[]'); }catch(e){ return []; } }
function tbQSave(q){ try{ localStorage.setItem(TB_QK, JSON.stringify(q.slice(-50))); return true; }catch(e){ return false; } }
// 'ok' = stored, 'drop' = rejected as invalid (never retry), 'retry' = offline or not allowed yet
async function tbPost(fields){
  try{
    const r = await fetch(TB_DB+'/toolbox/devices/'+tbId()+'.json',{method:'PATCH',body:JSON.stringify(fields),keepalive:true});
    if(r.ok) return 'ok';
    console.warn('toolbox stats: HTTP '+r.status);
    return r.status===400 ? 'drop' : 'retry';
  }catch(e){ return 'retry'; }
}
let tbBusy = false;
async function tbFlush(){
  if(tbBusy) return; tbBusy = true;
  try{
    while(true){
      const q = tbQ(); if(!q.length) break;
      const res = await tbPost(q[0]);
      if(res==='retry') break;
      const r = tbQ(); r.shift(); tbQSave(r);
    }
  }catch(e){}
  tbBusy = false;
}
// unsent events stay on the phone and are retried on the next open or tap
function tbSend(fields){
  const q = tbQ(); q.push(fields);
  if(tbQSave(q)) tbFlush(); else tbPost(fields);
}
function tbOpen(){
  const f={os:tbOS(), pwaInstalled:(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true,
    appVersion:tbVer(), lastSeen:TB_SV, lastOpenedAt:TB_SV, opens:TB_INC};
  f['daily/'+tbDay()+'/o']=TB_INC;
  tbSend(f);
}
function tbTap(id){ if(!id) return; const f={lastSeen:TB_SV}; f['taps/'+id+'/n']=TB_INC; f['taps/'+id+'/last']=TB_SV; tbSend(f); }
function tbMore(id){ if(!id) return; const f={lastSeen:TB_SV}; f['more/'+id]=TB_INC; tbSend(f); }
tbOpen();

/* Full-height fix (same as AirATIS): on an iPhone home-screen app, 100vh/svh and innerHeight come out shorter
   than the real screen and leave an empty strip under the footer. Use the screen height there (portrait only). */
function setAppHeight(){
  const iosApp = window.navigator.standalone === true;
  const h = iosApp ? Math.max(window.innerHeight, screen.height) : window.innerHeight;
  document.documentElement.style.setProperty('--app-h', h+'px');
}
setAppHeight();
window.addEventListener('resize', () => { setAppHeight(); });
window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 300));
function refitAppHeight(){ setAppHeight(); setTimeout(setAppHeight, 250); setTimeout(setAppHeight, 800); }
window.addEventListener('pageshow', refitAppHeight);
window.addEventListener('focus', refitAppHeight);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refitAppHeight(); });

/* UTC clock */
function tickClock(){
  const n = new Date(), p = v => String(v).padStart(2,'0');
  document.getElementById('utcClock').textContent = p(n.getUTCHours()) + ':' + p(n.getUTCMinutes());
}
tickClock(); setInterval(tickClock, 5000);

/* scroll cue */
const content = document.getElementById('content');
const sFade = document.getElementById('scrollFade');
const sBtn = document.getElementById('scrollBtn');
function updateCue(){
  const atBottom = content.scrollTop + content.clientHeight >= content.scrollHeight - 8;
  const fits = content.scrollHeight <= content.clientHeight + 8;
  sFade.classList.toggle('hide', atBottom || fits);
  sBtn.classList.toggle('hide', atBottom || fits);
}
sBtn.addEventListener('click', () => content.scrollBy({top: content.clientHeight * 0.8, behavior:'smooth'}));
content.addEventListener('scroll', updateCue, {passive:true});
window.addEventListener('resize', updateCue);
window.addEventListener('load', updateCue);
updateCue();

/* refresh */
async function forceReload(){
  try{
    if('caches' in window){ const k=await caches.keys(); await Promise.all(k.map(x=>caches.delete(x))); }
    if(navigator.serviceWorker){ const r=await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(x=>x.unregister())); }
  }catch(e){}
  const u=new URL(window.location.href); u.searchParams.set('r',Date.now()); window.location.replace(u.href);
}
document.querySelectorAll('.footer-refresh').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); forceReload(); }));

/* splash: typed slogan, tap to skip */
(function(){
  const sp = document.getElementById('splash');
  const l1 = document.getElementById('spLine1'), l2 = document.getElementById('spLine2');
  const text = 'All your flight tools, in one place.';
  let i = 0, done = false, timers = [];
  function close(){
    if(done) return; done = true;
    timers.forEach(clearTimeout);
    sp.classList.add('fade');
    setTimeout(() => { sp.classList.add('gone'); updateCue(); }, 340);
  }
  sp.addEventListener('click', close);
  const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){
    l1.textContent = text; l2.classList.add('show');
    timers.push(setTimeout(close, 2500));
    return;
  }
  function type(){
    if(done) return;
    l1.textContent = text.slice(0, ++i);
    if(i < text.length) timers.push(setTimeout(type, 45));
    else { l2.classList.add('show'); timers.push(setTimeout(close, 2300)); }
  }
  timers.push(setTimeout(type, 500));
})();
</script>
